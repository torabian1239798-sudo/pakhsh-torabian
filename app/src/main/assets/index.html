<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef3ff"><link rel="manifest" href="manifest.webmanifest">
<title>سامانه مدیریت پخش</title>
<style>
:root{--bg:#f0f4ff;--blue:#1598d2;--navy:#17476b;--ink:#202938;--muted:#758397;--line:#e8edf5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,"Segoe UI",sans-serif;padding-bottom:84px}
header{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;background:#f0f4fff2;backdrop-filter:blur(12px);z-index:5}
header h1{font-size:18px;margin:0;font-weight:800}.headbtn{border:1px solid #48a9dc;color:#168bc4;background:#fff;border-radius:12px;width:42px;height:42px;font-size:21px}
main{max-width:900px;margin:auto;padding:8px 16px 20px}.hero{min-height:140px;border-radius:26px;background:linear-gradient(135deg,#fff,#f8fbff);box-shadow:0 5px 18px #243e6412;display:flex;flex-direction:column;justify-content:center;padding:22px;margin:8px 0 22px;border:1px solid #e8edf8}
.eyebrow{color:var(--blue);font-size:12px;font-weight:bold}.hero strong{font-size:22px;margin:8px 0}.hero span{font-size:12px;color:var(--muted)}
.section-title{display:flex;align-items:center;gap:10px;font-weight:bold;margin:18px 0 13px}.section-title:after{content:"";height:1px;background:#cbd5e4;flex:1}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:22px}.stat{background:#fff;border:1px solid var(--line);border-radius:17px;padding:14px;box-shadow:0 5px 18px #243e640a}.stat small{color:var(--muted);display:block;margin-bottom:9px}.stat b{font-size:16px;color:var(--navy)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 9px}.tile{border:0;background:transparent;text-align:center;color:var(--ink);font:inherit;cursor:pointer;min-width:0}.tile .ico{width:74px;height:74px;border-radius:23px;background:#fff;box-shadow:0 2px 9px #243e6410;display:grid;place-items:center;margin:0 auto 8px;color:#168fc8;font-size:29px;border:1px solid #edf0f7}.tile span{font-size:12px;line-height:1.7;display:block}
.panel{background:#fff;border:1px solid var(--line);border-radius:19px;padding:15px;box-shadow:0 5px 18px #243e640a;margin:13px 0}.panel h2{font-size:16px;margin:0 0 13px}.field{margin:10px 0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid #dfe6f0;border-radius:11px;padding:11px;font:inherit;font-size:13px;background:#fbfcff;color:var(--ink)}.btn{border:0;border-radius:11px;background:var(--blue);color:white;padding:11px 15px;font:inherit;font-size:13px;font-weight:bold;cursor:pointer}.btn.secondary{background:#eaf5fb;color:#147eae}.btn.danger{background:#fff0f0;color:#c44747}.btn.tiny{padding:7px 10px;font-size:11px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}.list{display:grid;gap:8px}.item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:11px;border:1px solid var(--line);border-radius:13px;background:#fff}.item small{display:block;color:var(--muted);margin-top:5px;font-size:11px}.empty{color:var(--muted);text-align:center;padding:22px;font-size:13px}
.bottom{position:fixed;bottom:0;left:0;right:0;height:73px;background:#ffffffef;backdrop-filter:blur(12px);border-radius:20px 20px 0 0;box-shadow:0 -4px 20px #243e6410;display:flex;justify-content:space-around;align-items:center;z-index:10}.bottom button{background:none;border:0;color:#9aa6b6;font-size:11px;display:grid;gap:4px;justify-items:center}.bottom button b{font-size:22px}.bottom button.active{color:var(--blue)}
.back{border:0;background:none;color:var(--blue);font:inherit;padding:8px 0;cursor:pointer}.muted{color:var(--muted);font-size:11px}.pill{border-radius:30px;background:#eaf6fc;color:#1588bd;padding:5px 9px;font-size:10px;white-space:nowrap}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:9px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th{color:var(--muted);font-weight:normal}.negative{color:#c44747}.positive{color:#16865b}
@media(min-width:650px){.stats{grid-template-columns:repeat(4,1fr)}.grid{grid-template-columns:repeat(4,1fr);gap:21px}.tile .ico{width:84px;height:84px}}
@media print{header,.bottom,.back,.no-print,form,.actions{display:none!important}body{background:white;padding:0}.panel{box-shadow:none;border:0}main{max-width:none;padding:0}}
</style></head>
<body>
<header><button class="headbtn" onclick="home()">☷</button><h1 id="topTitle">سامانه مدیریت پخش</h1><button class="headbtn" onclick="about()">ⓘ</button></header>
<main id="app"></main>
<nav class="bottom"><button class="active" onclick="home()"><b>⌂</b>خانه</button><button onclick="openMod('products')"><b>▤</b>اطلاعات</button><button onclick="openMod('settings')"><b>⚙</b>تنظیمات</button></nav>
<script>
const $=s=>document.querySelector(s), get=k=>JSON.parse(localStorage.getItem(k)||'[]'), put=(k,v)=>localStorage.setItem(k,JSON.stringify(v)), id=()=>Date.now()+Math.floor(Math.random()*1000), money=n=>(Number(n)||0).toLocaleString('fa-IR')+' تومان';
const mods=[['🧾','ثبت سفارش','orders'],['📦','انبارداری هوشمند','inventory'],['🛍️','محصولات','products'],['🏬','پرونده فروشگاه‌ها','customers'],['💳','حسابداری','accounts'],['🖨️','فاکتورها','invoices'],['📒','مدیریت چک','checks'],['🗺️','مسیر ویزیت','visits'],['📊','گزارش عملکرد','reports'],['🏢','خرید از شرکت','purchases']];
const titles={orders:'مدیریت سفارش‌ها',inventory:'انبارداری هوشمند',products:'مدیریت محصولات',customers:'پرونده فروشگاه‌ها',accounts:'حسابداری حرفه‌ای',invoices:'فاکتورها و چاپ',checks:'مدیریت چک',visits:'مسیر ویزیت',reports:'گزارش عملکرد',purchases:'خرید از شرکت',settings:'تنظیمات'};
function title(t){$('#topTitle').textContent=t}
function home(){title('سامانه مدیریت پخش');let o=get('orders'),p=get('products'),c=get('customers'),sum=o.reduce((a,x)=>a+ +x.total,0),due=o.filter(x=>x.status!=='تحویل‌شده').length;
$('#app').innerHTML=`<section class="hero"><span class="eyebrow">پنل مدیریت و عملیات روزانه</span><strong>مدیریت یکپارچه پخش</strong><span>چی‌توز و بیسکویت‌های نیسا | نسخه دوم</span></section><div class="section-title">خلاصه عملکرد</div><div class="stats"><div class="stat"><small>مجموع فروش ثبت‌شده</small><b>${money(sum)}</b></div><div class="stat"><small>سفارش‌های در جریان</small><b>${due.toLocaleString('fa-IR')}</b></div><div class="stat"><small>فروشگاه‌ها</small><b>${c.length.toLocaleString('fa-IR')}</b></div><div class="stat"><small>اقلام محصول</small><b>${p.length.toLocaleString('fa-IR')}</b></div></div><div class="section-title">خدمات برنامه</div><div class="grid">${mods.map(m=>`<button class="tile" onclick="openMod('${m[2]}')"><div class="ico">${m[0]}</div><span>${m[1]}</span></button>`).join('')}</div>`}
function openMod(k){title(titles[k]||'');$('#app').innerHTML=`<button class="back" onclick="home()">→ بازگشت به خانه</button><section id="content"></section>`;({products:products,customers:customers,orders:orders,inventory:inventory,accounts:accounts,invoices:invoices,checks:checks,visits:visits,reports:reports,purchases:purchases,settings:settings}[k]||home)()}
function formFields(fields){return fields.map(f=>`<div class="field"><label>${f[1]}</label>${f[2]==='select'?`<select name="${f[0]}" ${f[3]?'required':''}>${f[3]||''}</select>`:`<input name="${f[0]}" type="${f[2]||'text'}" ${f[3]?'required':''} ${f[2]==='number'?'min="0"':''}>`}</div>`).join('')}
function simpleCrud(key,fields,heading,display,sub){let a=get(key);$('#content').innerHTML=`<div class="panel"><h2>${heading}</h2><form id="frm">${formFields(fields)}<button class="btn">ثبت اطلاعات</button></form></div><div class="panel"><h2>فهرست (${a.length})</h2><div class="list" id="rows"></div></div>`;
$('#frm').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));d.id=id();a.unshift(d);put(key,a);simpleCrud(key,fields,heading,display,sub)};
$('#rows').innerHTML=a.map(x=>`<div class="item"><div><b>${display(x)}</b><small>${sub(x)}</small></div><button class="btn danger tiny" onclick="del('${key}',${x.id})">حذف</button></div>`).join('')||'<div class="empty">اطلاعاتی ثبت نشده است.</div>'}
function del(k,i){put(k,get(k).filter(x=>x.id!==i));openMod(k)}
function products(){simpleCrud('products',[['name','نام محصول','text',1],['brand','برند / گروه','text'],['size','وزن یا بسته‌بندی'],['buy','قیمت خرید','number'],['sell','قیمت فروش پایه','number'],['stock','موجودی اولیه','number']], 'ثبت محصول',x=>x.name,x=>`موجودی ${x.stock||0} | قیمت فروش ${money(x.sell)}`)}
function customers(){simpleCrud('customers',[['name','نام فروشگاه','text',1],['phone','شماره تماس','tel'],['address','نشانی'],['credit','سقف اعتبار (تومان)','number']], 'ثبت فروشگاه',x=>x.name,x=>`${x.phone||'بدون تلفن'} | ${x.address||'بدون نشانی'}`)}
function orders(){let ps=get('products'),cs=get('customers'),os=get('orders');$('#content').innerHTML=`<div class="panel"><h2>ثبت سفارش جدید</h2><form id="f"><div class="field"><label>فروشگاه</label><select name="customer" required><option value="">انتخاب فروشگاه</option>${cs.map(c=>`<option>${c.name}</option>`).join('')}</select></div><div class="field"><label>محصول</label><select name="product" id="prod" required><option value="">انتخاب محصول</option>${ps.map((p,i)=>`<option value="${i}">${p.name} ${p.size||''}</option>`).join('')}</select></div><div class="two"><div class="field"><label>تعداد</label><input name="qty" type="number" min="1" value="1" required></div><div class="field"><label>قیمت واحد (قابل تغییر)</label><input name="price" id="price" type="number" min="0" required></div></div><button class="btn">ثبت سفارش</button></form></div><div class="panel"><h2>سفارش‌ها</h2><div class="list" id="olist"></div></div>`;
$('#prod').onchange=e=>$('#price').value=ps[+e.target.value]?.sell||'';
$('#f').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target)),p=ps[+d.product],q=+d.qty,price=+d.price;if(!p)return; if(+p.stock<q){alert('موجودی کافی نیست. ابتدا موجودی انبار را اصلاح کنید.');return}p.stock=+p.stock-q;put('products',ps);let o={id:id(),customer:d.customer,product:p.name,qty:q,price,total:q*price,status:'ثبت‌شده',date:new Date().toISOString().slice(0,10)};os.unshift(o);put('orders',os);orders()};
renderOrderList()}
function renderOrderList(){let a=get('orders');$('#olist').innerHTML=a.map(o=>`<div class="item"><div><b>${o.customer}</b><small>${o.product} × ${o.qty} | ${money(o.total)}<br>وضعیت: ${o.status}</small></div><div class="actions"><button class="btn secondary tiny" onclick="statusOrder(${o.id})">تغییر وضعیت</button><button class="btn tiny" onclick="printInvoice(${o.id})">فاکتور</button></div></div>`).join('')||'<div class="empty">سفارشی ثبت نشده است.</div>'}
function statusOrder(i){let a=get('orders'),o=a.find(x=>x.id===i),opts=['ثبت‌شده','آماده ارسال','تحویل‌شده','لغوشده'];o.status=opts[(opts.indexOf(o.status)+1)%opts.length];put('orders',a);orders()}
function inventory(){let p=get('products');$('#content').innerHTML=`<div class="panel"><h2>ثبت ورود یا اصلاح موجودی</h2><form id="f"><div class="field"><label>محصول</label><select name="idx">${p.map((x,i)=>`<option value="${i}">${x.name} (${x.stock||0} عدد)</option>`).join('')}</select></div><div class="field"><label>نوع عملیات</label><select name="type"><option value="in">ورود به انبار</option><option value="out">خروج از انبار</option></select></div><div class="field"><label>تعداد</label><input name="qty" type="number" min="1" required></div><div class="field"><label>شرح</label><input name="note"></div><button class="btn">ثبت گردش انبار</button></form></div><div class="panel"><h2>موجودی فعلی</h2><div class="list">${p.map(x=>`<div class="item"><b>${x.name}</b><span class="pill">${(+x.stock||0).toLocaleString('fa-IR')} عدد</span></div>`).join('')||'<div class="empty">محصولی ثبت نشده است.</div>'}</div></div><div class="panel"><h2>تاریخچه گردش انبار</h2><div class="list">${get('stockMoves').slice(0,30).map(x=>`<div class="item"><div>${x.product}<small>${x.note||'بدون شرح'}</small></div><b>${x.type==='in'?'+':'−'}${x.qty}</b></div>`).join('')||'<div class="empty">گردشی ثبت نشده است.</div>'}</div></div>`;
$('#f').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target)),p=get('products'),x=p[+d.idx],q=+d.qty;if(!x)return;if(d.type==='out'&&q>+x.stock){alert('موجودی کافی نیست');return}x.stock=(+x.stock)+(d.type==='in'?q:-q);put('products',p);let m=get('stockMoves');m.unshift({id:id(),product:x.name,type:d.type,qty:q,note:d.note,date:new Date().toISOString()});put('stockMoves',m);inventory()}}
function accounts(){let customers=get('customers'),orders=get('orders'),payments=get('payments');$('#content').innerHTML=`<div class="panel"><h2>ثبت دریافت از فروشگاه</h2><form id="f"><div class="field"><label>فروشگاه</label><select name="customer">${customers.map(c=>`<option>${c.name}</option>`).join('')}</select></div><div class="field"><label>مبلغ دریافتی (تومان)</label><input name="amount" type="number" min="1" required></div><div class="field"><label>روش دریافت</label><select name="method"><option>نقدی</option><option>کارت‌به‌کارت</option><option>چک</option></select></div><div class="field"><label>شرح</label><input name="note"></div><button class="btn">ثبت دریافت</button></form></div><div class="panel"><h2>مانده حساب فروشگاه‌ها</h2><div class="list">${customers.map(c=>{let debt=orders.filter(o=>o.customer===c.name&&o.status!=='لغوشده').reduce((s,o)=>s+ +o.total,0),paid=payments.filter(p=>p.customer===c.name).reduce((s,p)=>s+ +p.amount,0);return `<div class="item"><div><b>${c.name}</b><small>فروش ${money(debt)} | دریافت ${money(paid)}</small></div><b>${money(debt-paid)}</b></div>`}).join('')||'<div class="empty">فروشگاهی ثبت نشده است.</div>'}</div></div>`;
$('#f').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target)),a=get('payments');a.unshift({...d,id:id(),date:new Date().toISOString()});put('payments',a);accounts()}}
function printInvoice(i){let o=get('orders').find(x=>x.id===i);if(!o)return;let w=window.open('','_blank');w.document.write(`<html lang="fa" dir="rtl"><meta charset="utf-8"><title>فاکتور فروش</title><style>body{font-family:Tahoma;padding:35px}h2{text-align:center}table{width:100%;border-collapse:collapse;margin-top:30px}td,th{border:1px solid #aaa;padding:12px;text-align:right}.foot{margin-top:40px}</style><h2>فاکتور فروش</h2><p>شماره فاکتور: ${o.id}</p><p>فروشگاه: ${o.customer}</p><p>تاریخ: ${o.date}</p><table><tr><th>شرح کالا</th><th>تعداد</th><th>قیمت واحد</th><th>مبلغ</th></tr><tr><td>${o.product}</td><td>${o.qty}</td><td>${money(o.price)}</td><td>${money(o.total)}</td></tr></table><h3>جمع کل: ${money(o.total)}</h3><div class="foot">امضا و مهر فروشنده: ........................</div><script>window.print()<\/script></html>`);w.document.close()}
function invoices(){let a=get('orders');$('#content').innerHTML=`<div class="panel"><h2>فاکتور سفارش‌ها</h2><div class="list">${a.map(o=>`<div class="item"><div><b>${o.customer}</b><small>${o.product} | ${money(o.total)} | ${o.date}</small></div><button class="btn tiny" onclick="printInvoice(${o.id})">چاپ فاکتور</button></div>`).join('')||'<div class="empty">فاکتوری موجود نیست.</div>'}</div></div>`}
function checks(){simpleCrud('checks',[['number','شماره چک','text',1],['customer','نام فروشگاه / طرف حساب','text',1],['bank','بانک'],['amount','مبلغ (تومان)','number'],['due','تاریخ سررسید','date'],['status','وضعیت (دریافت‌شده، وصول‌شده، برگشتی)','text']], 'ثبت چک',x=>x.number,x=>`${x.customer} | ${money(x.amount)} | سررسید ${x.due||'نامشخص'} | ${x.status||'در انتظار'}`)}
function visits(){let cs=get('customers');$('#content').innerHTML=`<div class="panel"><h2>ثبت ویزیت فروشگاه</h2><form id="f"><div class="field"><label>فروشگاه</label><select name="customer">${cs.map(c=>`<option>${c.name}</option>`).join('')}</select></div><div class="field"><label>نتیجه مراجعه</label><select name="result"><option>ویزیت شد</option><option>سفارش ثبت شد</option><option>فروش انجام نشد</option><option>فروشگاه بسته بود</option></select></div><div class="field"><label>یادداشت</label><input name="note" placeholder="مثلاً پیگیری سفارش یا تماس مجدد"></div><button class="btn">ثبت مراجعه</button></form></div><div class="panel"><h2>فهرست مسیر ویزیت / برنامه مراجعه</h2><div class="list">${cs.map(c=>`<div class="item"><div><b>${c.name}</b><small>${c.address||'نشانی ثبت نشده'} | ${c.phone||''}</small></div><button class="btn secondary tiny" onclick="quickVisit('${c.name.replace(/'/g,"\\'")}')">ثبت ویزیت</button></div>`).join('')||'<div class="empty">ابتدا فروشگاه ثبت کنید.</div>'}</div></div><div class="panel"><h2>سوابق ویزیت</h2><div class="list">${get('visits').slice(0,40).map(v=>`<div class="item"><div><b>${v.customer}</b><small>${v.result} | ${v.note||''}</small></div><span class="muted">${v.date}</span></div>`).join('')||'<div class="empty">مراجعه‌ای ثبت نشده است.</div>'}</div></div>`;
$('#f').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target)),a=get('visits');a.unshift({...d,id:id(),date:new Date().toLocaleDateString('fa-IR')});put('visits',a);visits()}}
function quickVisit(n){let a=get('visits');a.unshift({id:id(),customer:n,result:'ویزیت شد',note:'ثبت سریع',date:new Date().toLocaleDateString('fa-IR')});put('visits',a);visits()}
function reports(){let o=get('orders'),sum=o.reduce((s,x)=>s+ +x.total,0),p=get('products'),low=p.filter(x=>+x.stock<=5);$('#content').innerHTML=`<div class="panel"><h2>گزارش عملکرد کلی</h2><div class="stats"><div class="stat"><small>تعداد سفارش</small><b>${o.length}</b></div><div class="stat"><small>مجموع فروش</small><b>${money(sum)}</b></div><div class="stat"><small>ویزیت ثبت‌شده</small><b>${get('visits').length}</b></div><div class="stat"><small>چک‌های ثبت‌شده</small><b>${get('checks').length}</b></div></div></div><div class="panel"><h2>محصولات با موجودی کم (۵ عدد یا کمتر)</h2><div class="list">${low.map(x=>`<div class="item"><b>${x.name}</b><span class="pill">${x.stock} عدد</span></div>`).join('')||'<div class="empty">موردی وجود ندارد.</div>'}</div></div><div class="panel"><h2>وضعیت سفارش‌ها</h2>${['ثبت‌شده','آماده ارسال','تحویل‌شده','لغوشده'].map(s=>`<div class="item"><span>${s}</span><b>${o.filter(x=>x.status===s).length}</b></div>`).join('')}</div>`}
function purchases(){simpleCrud('purchases',[['company','شرکت / تأمین‌کننده','text',1],['date','تاریخ','date'],['description','شرح خرید'],['amount','مبلغ کل (تومان)','number']], 'ثبت خرید از شرکت',x=>x.company,x=>`${x.description||''} | ${money(x.amount)}`)}
function settings(){$('#content').innerHTML=`<div class="panel"><h2>پشتیبان‌گیری اطلاعات</h2><p class="muted">اطلاعات این نسخه در حافظه همین مرورگر ذخیره می‌شود. به‌طور منظم خروجی بگیرید.</p><button class="btn" onclick="backup()">دریافت فایل پشتیبان</button><div class="field"><label>بازیابی فایل پشتیبان JSON</label><input type="file" id="bf" accept=".json"></div><button class="btn secondary" onclick="restore()">بازیابی اطلاعات</button></div><div class="panel"><h2>اطلاعات نسخه</h2><p class="muted">نسخه دوم آزمایشی | نام نهایی بعداً تعیین می‌شود.</p></div>`}
function backup(){let keys=['products','customers','orders','stockMoves','payments','checks','visits','purchases'];let d=Object.fromEntries(keys.map(k=>[k,get(k)])),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:'application/json'}));a.download='pakhsh-backup.json';a.click();URL.revokeObjectURL(a.href)}
function restore(){let f=$('#bf').files[0];if(!f)return alert('فایل را انتخاب کنید');let r=new FileReader();r.onload=()=>{try{Object.entries(JSON.parse(r.result)).forEach(([k,v])=>put(k,v));alert('اطلاعات بازیابی شد');home()}catch(e){alert('فایل پشتیبان معتبر نیست')}};r.readAsText(f)}
function about(){alert('نسخه دوم آزمایشی سامانه مدیریت پخش. داده‌ها فعلاً فقط روی همین دستگاه ذخیره می‌شوند.')}
home();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
